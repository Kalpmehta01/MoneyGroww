      name="description"
      content="Goal planner, SIP, loan and withdrawal calculators that show what your money is really worth: after fund costs, tax and inflation, in today's rupees. Free, no sign-up."
    />
    <meta name="keywords" content="goal planner, SIP calculator, step-up SIP, EMI prepayment calculator, SWP calculator, inflation adjusted returns, LTCG tax, personal finance India" />

    <link rel="canonical" href="https://moneygroww.com" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MoneyGroww - Smart Financial Planning & Investment Calculators" />
    <meta property="og:description" content="Plan goals with honest numbers: after fund costs, tax and inflation. Free goal planner, SIP, loan and withdrawal calculators." />
    <meta property="og:site_name" content="MoneyGroww" />
    <meta property="og:url" content="https://moneygroww.com" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MoneyGroww - Smart Financial Planning" />

      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Netlify detects forms at build time from the static HTML, so the React
         contact form needs this hidden twin for its submissions to be accepted.
         Field names must match the ones posted in about-contact.tsx. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <form name="early-access" netlify netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="interests" />
      <input type="text" name="consent" />
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
