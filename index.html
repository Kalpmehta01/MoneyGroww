    <meta property="og:description" content="Plan your financial future with SIP, Mutual Fund, and EMI calculators. Track live market data and get AI-powered investment insights." />

    <meta property="og:url" content="https://moneygroww.com" />

      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Netlify detects forms at build time from the static HTML, so the React
         contact form needs this hidden twin for its submissions to be accepted.
         Field names must match the ones posted in about-contact.tsx. -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
